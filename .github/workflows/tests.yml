name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu  # skip the CUDA build
      - run: pip install -r requirements.txt
      - run: pytest tests.py
